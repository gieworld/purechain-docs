site_name: PureChain Docs
site_description: >-
  Documentation for PureChain — a permissioned, free-gas EVM network on Clique
  PoA with Shanghai/Cancun, built on an auditable fork of go-ethereum v1.13.15.
site_url: https://gieworld.github.io/purechain-docs/
repo_url: https://github.com/gieworld/purechain-docs
repo_name: gieworld/purechain-docs
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        PureChain — a permissioned, free-gas EVM network on Clique PoA with
        Shanghai/Cancun, built on a fork of go-ethereum v1.13.15.
      sections:
        Overview:
          - index.md
          - 01-overview/*.md
        Run your own network:
          - 02-run-your-own/*.md
        Operating a network:
          - 03-operating/*.md
        The client:
          - 04-client/*.md
        Reference:
          - 05-reference/*.md
        Tooling:
          - 06-tooling/*.md
        Join the public network:
          - 06-join/*.md
        Contributing:
          - CONTRIBUTING.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Overview:
      - What is PureChain: 01-overview/what-is-purechain.md
      - Free gas: 01-overview/free-gas.md
      - Architecture: 01-overview/architecture.md
      - FAQ: 01-overview/faq.md
  - Run your own network:
      - Overview: 02-run-your-own/index.md
      - 1. Prerequisites: 02-run-your-own/prerequisites.md
      - 2. Create the genesis: 02-run-your-own/genesis.md
      - 3. Start validators: 02-run-your-own/validators.md
      - 4. Add RPC nodes: 02-run-your-own/rpc-nodes.md
      - 5. Verify it works: 02-run-your-own/verify.md
      - Running with Docker: 02-run-your-own/docker.md
      - Production checklist: 02-run-your-own/production.md
  - Operating a network:
      - Operations: 03-operating/operations.md
      - Smart Auto Mining (SAM): 03-operating/sealing.md
      - PoA² validator management: 03-operating/poa2.md
      - Troubleshooting: 03-operating/troubleshooting.md
  - The client:
      - purechain-geth: 04-client/purechain-geth.md
      - Download and install: 04-client/download.md
      - What changed vs upstream: 04-client/consensus-changes.md
      - Building from source: 04-client/building-from-source.md
  - Reference:
      - Chain parameters: 05-reference/chain-params.md
      - Genesis format: 05-reference/genesis-format.md
      - Peering: 05-reference/peering.md
      - Wallets and apps: 05-reference/wallets.md
      - Research: 05-reference/research.md
  - Tooling:
      - Explorer: 06-tooling/explorer.md
      - Faucet: 06-tooling/faucet.md
  - Join the public network:
      - Overview: 06-join/index.md
      - Request node access: 06-join/node-access.md
      - Validator requirements: 06-join/validator-requirements.md
      - How to apply: 06-join/validator-apply.md
  - Contributing: CONTRIBUTING.md

# Footer notice on every page: docs are CC BY 4.0, the client is not.
copyright: >-
  Copyright &copy; 2026 PureChain —
  documentation licensed <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
  The execution client is a go-ethereum fork under LGPL-3.0 / GPL-3.0.

extra_javascript:
  - assets/chat.js

extra_css:
  - assets/chat.css
